id: qualification-item-a
kind: qualification
needs:
  - integration-example-a
watch:
  - qualification/item-a/**
strategy:
  affected: changed
  reuse: true
steps:
  - id: build
    run: [python, build.py]
    outputs: [built.txt]
  - id: verify
    run: [python, verify.py]
    outputs: [verified.txt]
