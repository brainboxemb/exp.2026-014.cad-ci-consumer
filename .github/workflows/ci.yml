name: Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  reusable-plan:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-plan.yml@fac7f138dc429b5236ea79871bbb96a054e2c7d3
    with:
      full_run: true

  verify-reusable-plan:
    needs: reusable-plan
    runs-on: ubuntu-latest
    steps:
      - name: Check plan returned by called workflow
        env:
          PLAN_JSON: ${{ needs.reusable-plan.outputs.plan_json }}
        run: |
          python - <<'PY'
          import json
          import os

          rows = json.loads(os.environ["PLAN_JSON"])
          ids = [row["id"] for row in rows]
          if ids != ["workflow-case"]:
              raise SystemExit(f"unexpected reusable plan: {ids}")
          PY

  reusable-ci:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@fac7f138dc429b5236ea79871bbb96a054e2c7d3
    with:
      full_run: true
      environment_json: '{"ACCEPTANCE_MARKER":"reusable-workflow"}'
      upload_build: true
      build_artifact_name: cad-ci-workflow-case

  verify-build-artifact:
    needs: reusable-ci
    runs-on: ubuntu-latest
    steps:
      - name: Download handed-off build output
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.reusable-ci.outputs.build_artifact_name }}
          path: output/reusable-build

      - name: Check build output and hidden CAD-CI evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/reusable-build")
          result = root / "workflow_case" / "result.txt"
          evidence = root / "workflow_case" / ".cad-ci" / "item.json"

          if not result.is_file():
              raise SystemExit(f"missing handed-off output: {result}")
          if "reusable workflow executed caller item" not in result.read_text():
              raise SystemExit("handed-off result is not the caller workflow case")

          if not evidence.is_file():
              raise SystemExit(f"missing hidden CAD-CI evidence: {evidence}")
          state = json.loads(evidence.read_text())
          if state.get("status") != "pass":
              raise SystemExit(f"handed-off item evidence is not passing: {state}")

          leaked = list(root.rglob(".cache"))
          if leaked:
              raise SystemExit(f"private cache leaked into build artifact: {leaked}")
          PY

  test:
    needs:
      - reusable-plan
      - verify-reusable-plan
      - reusable-ci
      - verify-build-artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact released tool
        run: python scripts/bootstrap.py
      - name: Install exact released tool stack
        run: python -m pip install -e ext/cad-ci
      - name: Simple item
        run: python simple_case1/check.py
      - name: Changed-item selection
        run: python more_complex_case2/check.py
      - name: Dependencies and fan-out
        run: python dependency_case/check.py
      - name: Partial reruns
        run: python partial_rerun_case/check.py
      - name: Directory output and CacheDir
        run: python directory_output_case/check.py
      - name: Timeouts and failures
        run: python timeout_case/check.py
      - name: Durable build and Pages publication
        run: python publish_case/check.py
