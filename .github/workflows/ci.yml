name: Acceptance

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: write
  packages: read

jobs:
  consumer:
    uses: brainboxemb/tool.cad.ci/.github/workflows/reusable-ci.yml@c60bf64a393dff33440d22e9e9347cbbaba71c4b
    with:
      full_run: true
      environment_json: '{"ACCEPTANCE_MARKER":"reusable-workflow"}'
      upload_build: true
      build_artifact_name: cad-ci-workflow-acceptance

  test:
    needs: consumer
    runs-on: ubuntu-latest
    steps:
      - name: Download reusable workflow build
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.consumer.outputs.build_artifact_name }}
          path: output/workflow-artifact

      - name: Verify reusable workflow output and evidence
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("output/workflow-artifact")
          result = root / "workflow_case" / "result.txt"
          item_evidence = root / "workflow_case" / ".cad-ci" / "item.json"
          step_evidence = (
              root
              / "workflow_case"
              / ".cad-ci"
              / "steps"
              / "verify_environment.json"
          )

          if not result.is_file():
              raise SystemExit(f"missing handed-off output: {result}")
          result_text = result.read_text()
          if "reusable workflow executed caller item" not in result_text:
              raise SystemExit("handed-off result is not the caller workflow case")
          if "ghcr authentication available" not in result_text:
              raise SystemExit("consumer did not prove GHCR authentication")

          if not item_evidence.is_file():
              raise SystemExit(f"missing item evidence: {item_evidence}")
          item = json.loads(item_evidence.read_text())
          if item.get("status") != "pass":
              raise SystemExit(f"item evidence is not passing: {item}")

          if not step_evidence.is_file():
              raise SystemExit(f"missing step evidence: {step_evidence}")
          step = json.loads(step_evidence.read_text())
          if step.get("schema") != 2:
              raise SystemExit(f"unexpected step evidence schema: {step}")
          if step.get("output_state") not in {"UNCHANGED", "RESTORED", "REPAIRED"}:
              raise SystemExit(f"missing public output_state: {step}")
          obsolete_term = "material" + "ization"
          if obsolete_term in json.dumps(step):
              raise SystemExit(f"obsolete output term leaked into evidence: {step}")

          if list(root.rglob(".cache")):
              raise SystemExit("private CAD-CI cache leaked into build artifact")
          PY

      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bootstrap exact released tool
        run: python scripts/bootstrap.py
      - name: Verify released workflow has no persistent cache transport
        run: |
          python - <<'PY'
          from pathlib import Path

          workflow = Path("ext/cad-ci/.github/workflows/reusable-run.yml").read_text(
              encoding="utf-8"
          )
          forbidden = (
              "actions/cache/restore",
              "actions/cache/save",
              "cache-primary-key",
              "restore-keys:",
          )
          found = [value for value in forbidden if value in workflow]
          if found:
              raise SystemExit(
                  "released reusable workflow still contains persistent cache "
                  "transport: " + ", ".join(found)
              )
          PY
      - name: Install exact released tool stack
        run: python -m pip install -e ext/cad-ci
      - name: Simple item
        run: python simple_case1/check.py
      - name: Changed-item selection
        run: python more_complex_case2/check.py
      - name: Dependencies and fan-out
        run: python dependency_case/check.py
      - name: Partial reruns
        run: python partial_rerun_case/check.py
      - name: Directory output and CacheDir
        run: python directory_output_case/check.py
      - name: Timeouts and failures
        run: python timeout_case/check.py
      - name: Durable build and Pages publication
        run: python publish_case/check.py
